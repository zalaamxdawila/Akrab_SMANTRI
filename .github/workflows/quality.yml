name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer quality
      - name: Secret assignment scan
        run: |
          if grep -RInE \
            --exclude='.env.example' \
            --exclude='.env.testing.example' \
            --exclude-dir=.git \
            --exclude-dir=vendor \
            '(DB_PASS|PASSWORD|SECRET|TOKEN)[[:space:]]*=[[:space:]]*[^$<{[:space:]][^[:space:]]{7,}' .; then
            echo "Possible hard-coded secret assignment detected."
            exit 1
          fi

  model-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p test_model_pipeline.py
